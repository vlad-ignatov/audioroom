<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- A graphite bookshelf speaker on a walnut tile. The tile is 824 px inside
       the 1024 canvas, as macOS expects; `npm run icons` renders every size
       from this file. -->
  <defs>
    <!-- Light at the top, dark at the bottom, like Apple's own icons. -->
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8834c"/>
      <stop offset="1" stop-color="#8c5c31"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf5c"/>
      <stop offset="1" stop-color="#f0a63c"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43434c"/>
      <stop offset="1" stop-color="#26262c"/>
    </linearGradient>
    <radialGradient id="cone" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#ffd772"/>
      <stop offset="0.7" stop-color="#eea23a"/>
      <stop offset="1" stop-color="#b9741f"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#wood)"/>
  <!-- The speaker, drawn at its original size and enlarged about the centre. -->
  <g transform="translate(512 512) scale(1.12) translate(-512 -512)">
    <!-- Cabinet -->
    <rect x="332" y="212" width="360" height="600" rx="52" fill="url(#cab)" stroke="#1d1d22" stroke-width="6"/>
    <!-- Tweeter -->
    <circle cx="512" cy="345" r="62" fill="#17171b"/>
    <circle cx="512" cy="345" r="58" fill="none" stroke="#5b5b65" stroke-width="8"/>
    <circle cx="512" cy="345" r="28" fill="url(#amber)"/>
    <!-- Woofer: surround, cone, dust cap -->
    <circle cx="512" cy="590" r="150" fill="#141417"/>
    <circle cx="512" cy="590" r="138" fill="none" stroke="#4e4e58" stroke-width="16"/>
    <circle cx="512" cy="590" r="124" fill="url(#cone)"/>
    <circle cx="512" cy="590" r="40" fill="#c9842a"/>
    <!-- Bass port -->
    <rect x="452" y="764" width="120" height="22" rx="11" fill="#141417"/>
  </g>
</svg>
